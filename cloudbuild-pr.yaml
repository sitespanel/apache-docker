# Cloud Build: Apache httpd (server and origin) image for SitesPanel.
# Pull-request build: builds and scans only. Nothing is pushed and no secret is used, so it is
# safe for pull requests; the trigger still requires a maintainer comment for outside contributors.

substitutions:
  _AR_HOST: europe-docker.pkg.dev
  _AR_REPOSITORY: sitespanel-images

steps:
  # The version tag comes from the Dockerfile, as in the old GitHub workflow.
  - id: version
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        v=$$(grep -oP '^ARG HTTPD_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
        [ -n "$$v" ] || { echo "could not read the version from the Dockerfile"; exit 1; }
        echo "$$v" > /workspace/version
        echo "version $$v"
    waitFor: ['-']
  - id: build-apache-server
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --target=server
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/apache-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:latest
      - .
    waitFor: ['-']
  - id: build-apache-origin
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --target=origin
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/apache-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA-origin
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:origin
      - .
    waitFor: ['-']
  - id: save-apache-server
    name: gcr.io/cloud-builders/docker
    args: ['save', '--output', '/workspace/apache-server.tar', '${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA']
    waitFor: ['build-apache-server']
  - id: scan-apache-server
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/apache-server.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
    waitFor: ['save-apache-server']
  - id: save-apache-origin
    name: gcr.io/cloud-builders/docker
    args: ['save', '--output', '/workspace/apache-origin.tar', '${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA-origin']
    waitFor: ['build-apache-origin']
  - id: scan-apache-origin
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/apache-origin.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
    waitFor: ['save-apache-origin', 'scan-apache-server']

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
