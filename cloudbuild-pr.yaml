# Cloud Build: Apache httpd (server and origin) image for SitesPanel.
# Pull-request build: builds and scans only. Nothing is pushed and no secret is read.

substitutions:
  _REGISTRY: ghcr.io/sitespanel

steps:
  # The version tag comes from the Dockerfile.
  - id: version
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        v=$$(grep -oP '^ARG HTTPD_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
        [ -n "$$v" ] || { echo "could not read the version from the Dockerfile"; exit 1; }
        echo "$$v" > /workspace/version
        echo "version $$v"
    waitFor: ['-']
  - id: build-apache-server
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --target=server
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/apache-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - "--label=org.opencontainers.image.description=SitesPanel Apache httpd images: a server and an origin variant behind a TLS proxy."
      - --tag=${_REGISTRY}/apache:$SHORT_SHA
      - --tag=${_REGISTRY}/apache:latest
      - .
    waitFor: ['-']
  - id: scan-apache-server
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/apache-server.tar ${_REGISTRY}/apache:$SHORT_SHA']
    waitFor: ['build-apache-server']
  - id: trivy-apache-server
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/apache-server.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        rm -f /workspace/apache-server.tar
    waitFor: ['scan-apache-server']
  - id: build-apache-origin
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --target=origin
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/apache-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - "--label=org.opencontainers.image.description=SitesPanel Apache httpd images: a server and an origin variant behind a TLS proxy."
      - --tag=${_REGISTRY}/apache:$SHORT_SHA-origin
      - --tag=${_REGISTRY}/apache:origin
      - .
    waitFor: ['trivy-apache-server']
  - id: scan-apache-origin
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/apache-origin.tar ${_REGISTRY}/apache:$SHORT_SHA-origin']
    waitFor: ['build-apache-origin']
  - id: trivy-apache-origin
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/apache-origin.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        rm -f /workspace/apache-origin.tar
    waitFor: ['scan-apache-origin']

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
