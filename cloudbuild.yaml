# Cloud Build: Apache httpd (server and origin) image for SitesPanel.
# Publish build: runs on a push to main and on the weekly rebuild. Builds, scans, writes SBOMs,
# then pushes to Artifact Registry with SLSA provenance (SitesPanel ADR-0065). Nothing is pushed
# when a scan finds a fixable critical vulnerability.

substitutions:
  _AR_HOST: europe-docker.pkg.dev
  _AR_REPOSITORY: sitespanel-images
  _SBOM_BUCKET: sitespanel-image-sboms-europe  # set per trigger if the bucket has another name

steps:
  # The version tag comes from the Dockerfile, as in the old GitHub workflow.
  - id: version
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        v=$$(grep -oP '^ARG HTTPD_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
        [ -n "$$v" ] || { echo "could not read the version from the Dockerfile"; exit 1; }
        echo "$$v" > /workspace/version
        echo "version $$v"
    waitFor: ['-']
  - id: build-apache-server
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --target=server
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/apache-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:latest
      - .
    waitFor: ['-']
  - id: build-apache-origin
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --target=origin
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/apache-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA-origin
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:origin
      - .
    waitFor: ['-']
  - id: save-apache-server
    name: gcr.io/cloud-builders/docker
    args: ['save', '--output', '/workspace/apache-server.tar', '${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA']
    waitFor: ['build-apache-server']
  - id: scan-apache-server
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/apache-server.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/apache-server.tar --format spdx-json --output /workspace/sbom/apache-server.spdx.json
    waitFor: ['save-apache-server']
  - id: save-apache-origin
    name: gcr.io/cloud-builders/docker
    args: ['save', '--output', '/workspace/apache-origin.tar', '${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA-origin']
    waitFor: ['build-apache-origin']
  - id: scan-apache-origin
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/apache-origin.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/apache-origin.tar --format spdx-json --output /workspace/sbom/apache-origin.spdx.json
    waitFor: ['save-apache-origin', 'scan-apache-server']
  # Version tags (read from the Dockerfile) are pushed after every scan passed. They name the
  # same digests as the tags in `images` below, which carry the build provenance.
  - id: push-version-tags
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        v=$$(cat /workspace/version)
        docker tag ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$$v
        docker push ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$$v
        docker tag ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA-origin ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$$v-origin
        docker push ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$$v-origin
    waitFor: ['scan-apache-origin', 'version']

# Pushed only when every step succeeded; Cloud Build attaches SLSA provenance to these digests.
images:
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:latest
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:$SHORT_SHA-origin
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/apache:origin

artifacts:
  objects:
    location: gs://${_SBOM_BUCKET}/apache/$COMMIT_SHA/
    paths: ['/workspace/sbom/*.spdx.json']

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

timeout: 7200s
